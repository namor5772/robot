# tmux settings for the robot chat only. chat.sh starts tmux on its own socket
# with this file, so your own tmux setup, if you have one, is not affected.

# Mouse wheel scrolls back through the chat. To select text with the mouse,
# hold Shift while dragging.
set -g mouse on
set -g history-limit 20000

# A single quiet status line with the one key worth knowing.
set -g status-left ""
set -g status-right " leave it running: Ctrl-B then D "
set -g status-style "bg=default,fg=white,dim"

# Pass Escape through quickly so arrow keys and line editing feel normal.
set -sg escape-time 10
