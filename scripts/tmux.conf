# tmux settings for the robot chat only. chat.sh starts tmux on its own socket
# with this file, so your own tmux setup, if you have one, is not affected.

# Mouse wheel scrolls back through the chat. To select text with the mouse,
# hold Shift while dragging.
set -g mouse on
set -g history-limit 20000

# A single quiet status line with the one key worth knowing.
set -g status-left ""
set -g status-right " leave it running: Ctrl-B then D "
set -g status-style "bg=default,fg=white,dim"

# How long tmux waits for the rest of a message from your terminal before it
# treats what it has as key presses. When tmux attaches it asks the terminal
# for its colours and type, and the terminal answers with such messages. Over
# Wi-Fi an answer can arrive in two pieces a tenth of a second apart. With too
# short a wait (tmux 3.5's own default is 10 ms) tmux typed the answer into
# the chat, and "11;rgb:0c0c/0c0c/0c0c" appeared at you>. Half a second is
# what tmux used before 3.5. Its only cost: the Escape key pressed on its own
# takes that long to act. Arrow keys and typing are not delayed.
set -sg escape-time 500
